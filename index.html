<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragging Papers</title>
    <style>
        body{
            background-color:black;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
    .paper{
        padding:100px 100px;
        border:5px solid white;
        position:absolute;
    }
</style>
</head>
<body>
    <div class="paper"style="background-color:blue;"></div>
    <div class="paper"style="background-color:red;"></div>
<script>
    let highestZ = 1;

class Paper{
    holdingPaper = false;

    prevMouseX = 0;
    prevMouseY= 0;

    mouseX=0;
    mouseY=0;

    velocityX=0;
    velocityY=0;

    currentPaperX= 0 ;
    currentPaperY=0;



    init(paper){
        paper.addEventListener("mousedown",(e)=>{
            this.holdingPaper=true;
            paper.style.zIndex = highestZ;
            highestZ+=1;

            if(e.button === 0){
                this.prevMouseX = this.mouseX;
                this.prevMouseY = this.mouseY;

                console.log(this.prevMouseX);
                console.log(this.prevMouseY);
            }
        })
        document.addEventListener("mousemove",(e)=>{
            this.mouseX = e.clientX;
            this.mouseY = e.clientY;

            this.velocityX = this.mouseX - this.prevMouseX;
            this.velocityY = this.mouseY - this.prevMouseY;

            if (this.holdingPaper){
                this.currentPaperX += this.velocityX;
                this.currentPaperY += this.velocityY;

                this.prevMouseX = this.mouseX;
                this.prevMouseY = this.mouseY;

                paper.style.transform = `translate(${this.currentPaperX}px) translateY(${this.currentPaperY}px)`;
            }
        })
        window.addEventListener("mouseup",(e)=>{
            console.log("Mouse is released");
            this.holdingPaper=false;
        })
    }
}
const papers = Array.from(document.querySelectorAll(".paper"));

papers.forEach( paper=>{
    const p = new Paper();
    p.init(paper)
})
</script>
</body>
</html>
